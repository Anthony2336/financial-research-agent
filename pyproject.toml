[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Evidence-grounded financial research audit CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4>=4.12",
    "fastmcp>=2.0",
    "flashrank==0.2.10",
    "httpx>=0.28",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langfuse>=4.0",
    "langgraph>=0.3",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "sentence-transformers>=3.3",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "tiktoken>=0.8",
    "typer>=0.15",
    "rich>=13.0",
    "mcp[cli]>=1.27,<2",
    "rank-bm25>=0.2.2",
    "llmlingua>=0.2.2,<0.3",
]

[project.scripts]
ingest = "fra.cli:ingest_main"
research = "fra.cli:research_main"
eval = "fra.cli:eval_main"
prefetch-model-assets = "fra.prefetch_assets:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"fra.evals" = ["dataset.jsonl", "p2_dataset.jsonl"]
"fra.resources" = ["nvda_10q.html"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.optional-dependencies]
web-search = [
    "tavily-python>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live_sec and not live_provider'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
